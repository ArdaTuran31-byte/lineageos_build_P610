name: Build LineageOS for SM-P610

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3 repo

      - name: Configure Git
        run: |
          git config --global user.name "ArdaTuran31-byte"
          git config --global user.email "buildbot@example.com"

      - name: Initialize Repo and Sync
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-24.0 --depth=1

          if [ -d "$GITHUB_WORKSPACE/.repo/local_manifests" ]; then
            mkdir -p ~/lineage/.repo/local_manifests
            cp -r $GITHUB_WORKSPACE/.repo/local_manifests/* ~/lineage/.repo/local_manifests/
          fi

          repo sync -j16 --no-clone-bundle --no-tags

      - name: Start Building
        run: |
          cd ~/lineage
          source build/envsetup.sh
          lunch lineage_gta4xlwifi-userdebug
          mka bacon
